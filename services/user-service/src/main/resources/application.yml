server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
  expiration: 86400000      # 24 hours
  refresh-expiration: 604800000  # 7 days

logging:
  level:
    com.quickbite: DEBUG
    org.springframework.security: DEBUG
